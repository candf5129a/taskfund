<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | TaskFunds</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card register-card">

            <a href="../index.html" class="auth-logo">
                <span>Task</span>Funds
            </a>

            <div class="auth-header">

                <h1>Create your account</h1>

                <p>
                    Join TaskFunds and start earning from
                    simple tasks.
                </p>

            </div>


            <form class="auth-form">

                <div class="form-row">

                    <div>
                        <label for="first-name">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="first-name"
                            name="first-name"
                            placeholder="First name"
                            required
                        >
                    </div>


                    <div>
                        <label for="last-name">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="last-name"
                            name="last-name"
                            placeholder="Last name"
                            required
                        >
                    </div>

                </div>


                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div>

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="0801 234 5678"
                        required
                    >

                </div>


                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div>

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <label class="terms-check">

                    <input
                        type="checkbox"
                        name="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#">Terms of Service</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </span>

                </label>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="../js/navbar.js"></script>

</body>

</html>

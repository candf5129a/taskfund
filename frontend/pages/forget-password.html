<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TaskFunds</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a href="../index.html" class="auth-logo">
                <span>Task</span>Funds
            </a>


            <div class="auth-header">

                <h1>Welcome back</h1>

                <p>
                    Log in to your TaskFunds account
                    and continue earning.
                </p>

            </div>


            <form class="auth-form">

                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="auth-options">

                    <label class="remember-me">
                        <input
                            type="checkbox"
                            name="remember"
                        >
                        Remember me
                    </label>

                    <a href="forgot-password.html">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create one
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="../js/navbar.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TaskFunds</title>

    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/globals.css">
    <link rel="stylesheet" href="../styles/typography.css">
    <link rel="stylesheet" href="../styles/utilities.css">
    <link rel="stylesheet" href="../styles/responsive.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo a {
            text-decoration: none;
            font-size: 30px;
            font-weight: 800;
            color: #2254f8;
        }

        .auth-card {
            padding: 35px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h1 {
            margin-bottom: 8px;
        }

        .auth-header p {
            opacity: 0.7;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(128, 128, 128, 0.3);
            background: rgba(255, 255, 255, 0.06);
            color: inherit;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #ff6a00;
        }

        .forgot-password {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 22px;
        }

        .forgot-password a {
            font-size: 14px;
            text-decoration: none;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #3561f3;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            font-size: 14px;
        }

        .message.show {
            display: block;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .register-link a {
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

<main class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">
            <a href="../input.html">TaskFunds</a>
        </div>

        <section class="auth-card">

            <div class="auth-header">
                <h1>Welcome back</h1>
                <p>Login to your TaskFunds account</p>
            </div>

            <div id="login-message" class="message"></div>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="forgot-password">
                    <a href="forget-password.html">
                        Forgot password?
                    </a>
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="login-button"
                >
                    Login
                </button>

            </form>

            <div class="register-link">
                Don't have an account?
                <a href="register.html">Create one</a>
            </div>

        </section>

    </div>

</main>

<script src="../scripts/login.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | TaskFunds</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    
    <main class="auth-page">

        <div class="auth-card">

            <a href="../index.html" class="auth-logo">
                <span>Task</span>Funds
            </a>


            <div class="auth-header">

                <h1>Reset your password</h1>

                <p>
                    Create a new password for your TaskFunds
                    account.
                </p>

            </div>


            <form class="auth-form">

                <div>

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your new password"
                        required
                    >

                </div>


                <div>

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your new password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Reset Password
                </button>

            </form>


            <div class="auth-footer">

                <a href="login.html">
                    ← Back to Login
                </a>

            </div>

        </div>

    </main>


    <script src="../js/navbar.js"></script>

</body>

</html>
